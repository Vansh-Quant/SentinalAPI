.hero-visual{height:560px;position:relative;display:grid;place-items:center;isolation:isolate}.orbit{position:absolute;border:1px solid rgba(49,195,191,.18);border-radius:50%;transform:rotate(-18deg);filter:drop-shadow(0 0 18px rgba(15,190,176,.10));animation:orbitFloat 9s ease-in-out infinite}.orbit:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#5ff4df;box-shadow:0 0 16px #18e0c0;top:8%;left:16%;animation:orbitDot 5s linear infinite}.orbit.o1{width:470px;height:310px}.orbit.o2{width:390px;height:260px;transform:rotate(32deg);animation-duration:11s}.orbit.o2:after{background:#40bfff;box-shadow:0 0 16px #40bfff;animation-duration:6.5s}.orbit.o3{width:560px;height:360px;transform:rotate(8deg);animation-duration:14s;opacity:.65}
.platform{position:absolute;width:320px;height:170px;border-radius:35px 35px 45px 45px;transform:perspective(600px) rotateX(57deg) rotateZ(-8deg);background:linear-gradient(145deg,#0d3a49,#061a27);border:1px solid rgba(52,184,192,.42);box-shadow:0 42px 65px rgba(0,0,0,.65),0 0 55px rgba(12,190,181,.15),inset 0 1px 0 rgba(169,245,240,.18);animation:platformBreathe 4.8s ease-in-out infinite}.platform:after{content:"";position:absolute;inset:18px;border-radius:24px;background:linear-gradient(145deg,rgba(20,224,192,.16),rgba(26,55,69,.03));border:1px solid rgba(63,202,205,.2);box-shadow:inset 0 0 28px rgba(22,208,192,.08)}
.shield-wrap{position:relative;z-index:4;width:190px;height:220px;display:grid;place-items:center;animation:shieldFloat 5.2s ease-in-out infinite}.shield-glow{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(24,224,192,.38),rgba(24,157,176,.13) 42%,transparent 70%);filter:blur(10px);animation:pulseGlow 3.2s ease-in-out infinite}.shield{width:142px;height:176px;clip-path:polygon(50% 0,88% 15%,84% 67%,50% 100%,16% 67%,12% 15%);background:linear-gradient(145deg,#5af5df 0%,#12cbb5 30%,#08647d 70%,#063849 100%);box-shadow:0 0 40px rgba(24,224,192,.48),0 20px 42px rgba(0,0,0,.48);display:grid;place-items:center;position:relative;animation:shieldTilt 6s ease-in-out infinite;transform-style:preserve-3d}.shield:before{content:"";position:absolute;inset:9px;clip-path:inherit;background:linear-gradient(145deg,#0b3442,#06131d);opacity:.72}.shield:after{content:"";position:absolute;inset:-12px;clip-path:inherit;background:linear-gradient(105deg,transparent 35%,rgba(220,255,251,.34) 48%,transparent 60%);transform:translateX(-90%) skewX(-12deg);animation:shieldSheen 3.8s ease-in-out infinite}.shield-mark{position:relative;z-index:2;color:#eaffff;font-size:55px;text-shadow:0 0 22px rgba(190,255,247,.72);font-weight:900;animation:markPulse 2.8s ease-in-out infinite}

.scan-line{position:absolute;z-index:2;width:250px;height:2px;background:linear-gradient(90deg,transparent,#55f5df,transparent);filter:blur(.2px);opacity:.45;animation:scanMove 4.2s linear infinite}.visual-caption{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#607f8b;font-size:9px;white-space:nowrap;letter-spacing:.08em;text-transform:uppercase}.landing-trust{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:3;color:#6d8792;font-size:10px;text-align:center;white-space:nowrap}

@keyframes ambientDrift{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.04)}}@keyframes gridDrift{from{background-position:0 0,0 0}to{background-position:64px 64px,64px 64px}}@keyframes statusPulse{0%,100%{opacity:.65;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}@keyframes shieldFloat{0%,100%{transform:translate3d(0,0,0) rotate(-1deg)}50%{transform:translate3d(0,-17px,0) rotate(1deg)}}@keyframes shieldTilt{0%,100%{transform:rotateY(-4deg) rotateX(1deg)}50%{transform:rotateY(5deg) rotateX(-2deg)}}@keyframes markPulse{0%,100%{filter:brightness(.95);transform:scale(.98)}50%{filter:brightness(1.18);transform:scale(1.04)}}@keyframes pulseGlow{0%,100%{transform:scale(.92);opacity:.58}50%{transform:scale(1.12);opacity:1}}@keyframes shieldSheen{0%,20%{transform:translateX(-90%) skewX(-12deg)}58%,100%{transform:translateX(90%) skewX(-12deg)}}@keyframes floatBubble{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}20%{transform:translate3d(7px,-14px,0) rotate(1.5deg)}45%{transform:translate3d(-6px,-30px,0) rotate(-1deg)}70%{transform:translate3d(10px,-18px,0) rotate(1.2deg)}88%{transform:translate3d(-4px,-7px,0) rotate(-.5deg)}}@keyframes scanMove{0%{transform:translateY(-110px);opacity:0}15%{opacity:.65}85%{opacity:.65}100%{transform:translateY(110px);opacity:0}}@keyframes orbitFloat{0%,100%{transform:rotate(-18deg) translateY(0)}50%{transform:rotate(-13deg) translateY(-7px)}}@keyframes orbitDot{from{transform:rotate(0deg) translateX(210px) rotate(0deg)}to{transform:rotate(360deg) translateX(210px) rotate(-360deg)}}@keyframes platformBreathe{0%,100%{transform:perspective(600px) rotateX(57deg) rotateZ(-8deg) translateY(0);filter:brightness(.95)}50%{transform:perspective(600px) rotateX(57deg) rotateZ(-8deg) translateY(-4px);filter:brightness(1.08)}}@keyframes particleDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-70px,-95px,0)}}@keyframes haloSpin{to{transform:rotate(360deg)}}
@media(max-width:900px){.landing-hero{grid-template-columns:1fr;padding-top:28px}.hero-visual{height:420px;order:-1}.landing-copy{max-width:none}.landing-title{font-size:54px}.landing-features{grid-template-columns:repeat(2,1fr)}.landing-links{display:none}.landing-trust{position:relative;bottom:auto;left:auto;transform:none;padding:12px 20px 25px}.landing-nav{height:64px}.orbit.o3{width:470px}.bubble.b5{right:100px}}

<body>
<div class="app">

  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
</aside>
<main class="main">

  <div class="search"><span>⌕</span><input id="search" placeholder="Search findings, components, CVEs..."/></div>
  <div class="modes"><button data-mode="light">☀ Light</button><button data-mode="dark">◐ Dark</button><button data-mode="system">Auto</button></div>
  <button class="user user-btn" id="profileBtn" title="Open profile"><div class="avatar">JC</div><div><b>John Carter</b><small>Security Analyst</small></div></button>
</header>
<section class="content"><div class="page" id="page"></div></section>
</main>
</div><div id="toast" class="toast"></div>
<script>
const navItems=[
 ['overview','◉','Security Overview'],['config','⌁','Scan Configuration'],['live','◌','Live Testing'],['network','⌘','Network Graph'],['findings','◇','Finding Explorer'],['investigation','⌕','Investigation'],['poc','△','Proof of Concept'],['ai','✦','AI Explanation'],['report','▤','Security Report']
];
const findings=[
 ['Critical','Hardcoded API Key','Auth Service','Open','2h ago'],['High','Missing Authentication Check','API Gateway','Open','4h ago'],['Medium','Insecure Deserialization','Backend','Open','6h ago'],['Medium','SQL Injection Risk','Database','Open','8h ago'],['Low','Insecure CORS Policy','Frontend','Fixed','12h ago']
];
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button data-page="${x[0]}"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join('')+`<button data-page="profile"><span class="ico">◎</span><span>Profile</span></button>`;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function head(k,title,sub,actions=''){return `<div class="head"><div><div class="eyebrow">SentinelAPI workspace</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function card(title,body,extra=''){return `<div class="card">${title?`<div class="section-title"><h3>${title}</h3>${extra}</div>`:''}${body}</div>`}
function pill(s){return `<span class="pill ${s.toLowerCase()}">${s}</span>`}
function stat(icon,label,value,trend){return `<div class="card stat"><div class="stat-icon">${icon}</div><div class="value">${value}</div><div class="label">${label}</div><div class="trend">${trend}</div></div>`}
function chart(){return `<div class="chart"><svg viewBox="0 0 700 180" preserveAspectRatio="none"><path d="M0 142 L55 128 L110 116 L165 121 L220 101 L275 108 L330 83 L385 91 L440 70 L495 76 L550 57 L605 49 L700 30 L700 180 L0 180Z" fill="rgba(9,189,164,.10)"/><path d="M0 142 L55 128 L110 116 L165 121 L220 101 L275 108 L330 83 L385 91 L440 70 L495 76 L550 57 L605 49 L700 30" fill="none" stroke="var(--accent)" stroke-width="3"/><g stroke="var(--line)" stroke-width="1" opacity=".6"><path d="M0 45H700"/><path d="M0 90H700"/><path d="M0 135H700"/></g></svg></div>`}
function overview(){return head('overview','Security Overview','Overall security health and key metrics.','<button class="btn" onclick="toast(\'Last 7 days selected\')">Last 7 days ▾</button>')+`<div class="grid four" style="margin-bottom:12px">${stat('✦','Security Score','91','↗ +6%')}${stat('△','Total Issues','24','↗ +8%')}${stat('✓','Resolved Issues','17','↗ +12%')}${stat('!','Risk Level','High','↑ needs attention')}</div><div class="grid overview-grid"><div class="card"><div class="section-title"><h3>Security Trend</h3><span class="muted">Apr 20 — Apr 26</span></div>${chart()}<div style="height:12px"></div><div class="grid three"><div><div class="label">SAST</div><b>Complete</b></div><div><div class="label">Dependencies</div><b>Complete</b></div><div><div class="label">IaC</div><b>Complete</b></div></div></div><div class="card"><div class="section-title"><h3>Issue Distribution</h3><span class="muted">24 total</span></div><div style="display:flex;gap:18px;align-items:center;justify-content:center;padding:10px 0 18px"><div class="donut"></div><div style="display:flex;flex-direction:column;gap:9px;font-size:10px"><div>${pill('Critical')} <span>8 · 33%</span></div><div>${pill('High')} <span>7 · 29%</span></div><div>${pill('Medium')} <span>6 · 25%</span></div><div>${pill('Low')} <span>3 · 13%</span></div></div></div>${card('Recent Scans',`<table class="table"><tr><th>Repository</th><th>Type</th><th>Status</th><th>Date</th></tr><tr><td>frontend-app</td><td>SAST</td><td>${pill('good')}</td><td>2h ago</td></tr><tr><td>mobile-app</td><td>Full</td><td>${pill('good')}</td><td>4h ago</td></tr><tr><td>internal-services</td><td>Network</td><td>${pill('good')}</td><td>6h ago</td></tr></table>`)} </div></div>`}
function config(){return head('config','Scan Configuration','Set up your repository and scan preferences.','<button class="btn" onclick="toast(\'Configuration saved\')">Save Draft</button><button class="btn primary" onclick="go(\'live\')">Start Scan →</button>')+`<div class="scan-config"><div class="card"><div class="section-title"><h3>Repository Details</h3><span class="pill good">Ready</span></div><div class="field"><label>Repository URL</label><input value="https://github.com/acme/sentinelapi-app"/></div><div class="grid two"><div class="field"><label>Branch</label><select><option>main</option><option>develop</option></select></div><div class="field"><label>Scan Type</label><select><option>Quick Scan (Recommended)</option><option>Full Scan</option><option>Dependency Scan</option></select></div></div><h3 style="margin:12px 0 8px">Advanced Options</h3><div class="checks"><label class="check"><input type="checkbox" checked/> Include dependencies</label><label class="check"><input type="checkbox" checked/> Secret scanning</label><label class="check"><input type="checkbox" checked/> Scan container images</label><label class="check"><input type="checkbox" checked/> License compliance</label><label class="check"><input type="checkbox" checked/> Enable SAST</label><label class="check"><input type="checkbox"/> Ignore test files</label></div></div><div class="card profile"><div class="section-title"><h3>Configuration</h3><span class="muted">Default</span></div><div class="grid two"><div class="field"><label>Base Branch</label><select><option>main</option></select></div><div class="field"><label>Language</label><select><option>All</option></select></div><div class="field"><label>Scan Depth</label><select><option>Full</option></select></div><div class="field"><label>Scan Config</label><select><option>Default</option></select></div></div><div class="profile-art"><div style="text-align:center"><div class="cube"><span>▦</span></div><b style="display:block;margin-top:15px">Ready <script>
(function(){
  const targets = new Set(['scan-configuration','live-testing','finding-investigation','proof-of-concept','ai-explanation','profile']);
  function pageKey(){
    const el=document.querySelector('[data-page].active, .page.active, [id].active');
    if(el) return (el.dataset.page||el.id||'').toLowerCase();
    const h=[...document.querySelectorAll('h1,h2,h3')].find(x=>/scan configuration|live security scan|finding investigation|proof of concept|ai security explanation|profile/i.test(x.textContent||''));
    return h ? h.textContent.toLowerCase().replace(/[^a-z]+/g,'-') : '';
  }
  function fill(){
    document.querySelectorAll('.page-fill,.detail-fill').forEach(e=>e.classList.remove('page-fill','detail-fill'));
    const key=pageKey();
    const match=[...targets].some(t=>key.includes(t.replace(/-/g,' '))||key.includes(t));
    if(!match) return;
    const main=document.querySelector('main') || document.querySelector('.main-content') || document.querySelector('.content');
    if(!main) return;
    main.classList.add('page-fill');
    const blocks=[...main.children].filter(e=>e.nodeType===1 && !e.matches('header,.topbar,.breadcrumb'));
    const last=blocks[blocks.length-1]; if(last) last.classList.add('detail-fill');
  }
  new MutationObserver(fill).observe(document.body,{subtree:true,childList:true});
  window.addEventListener('resize',fill);
  setTimeout(fill,100);
})();
</script>
<script>
/* SentinelAPI backend adapter. The existing visual workspace stays unchanged. */
(function () {
  const API_BASE = window.SENTINEL_API_BASE || 'http://127.0.0.1:8001';
  const state = window.sentinelState = window.sentinelState || {
    token: localStorage.getItem('sentinel_token') || '',
    user: null,
    project: null,
    scan: null,
    findings: [],
    selectedFinding: null,
    socket: null,
    poller: null,
  };

  async function request(path, options) {
    const config = options || {};
    const headers = new Headers(config.headers || {});
    if (state.token) headers.set('Authorization', `Bearer ${state.token}`);
    const response = await fetch(`${API_BASE}${path}`, {...config, headers});
    const text = await response.text();
    let body = {};
    try { body = text ? JSON.parse(text) : {}; } catch (_) { body = {detail: text}; }
    if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
    return body;
  }

  function showError(error) {
    console.error(error);
    toast(error.message || String(error));
  }

  async function loadCurrentUser() {
    if (!state.token) return null;
    try {
      state.user = await request('/api/auth/me');
      updateWorkspaceIdentity();
      return state.user;
    } catch (error) {
      state.token = '';
      state.user = null;
      localStorage.removeItem('sentinel_token');
      return null;
    }
  }

  function updateWorkspaceIdentity() {
    const email = state.user?.email || 'Not signed in';
    const name = email.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
    document.querySelectorAll('.user-btn b').forEach(element => { element.textContent = name; });
    document.querySelectorAll('.user-btn small').forEach(element => { element.textContent = email; });
    document.querySelectorAll('.user-btn .avatar').forEach(element => { element.textContent = name.split(' ').map(part => part[0]).join('').slice(0, 2).toUpperCase(); });
  }

  function applyWorkspaceTheme(mode) {
    if (!['light', 'dark', 'system'].includes(mode)) return;
    localStorage.setItem('sentinelapi-mode', mode);
    const actual = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
    document.documentElement.dataset.theme = actual;
    document.querySelectorAll('.modes button[data-mode]').forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('.modes button[data-mode]');
    if (button) { event.preventDefault(); applyWorkspaceTheme(button.dataset.mode); }
  });

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  window.completeLogin = async function () {
    try {
      const body = await request('/api/auth/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('auth-email').value,
          password: document.getElementById('auth-password').value,
        }),
      });
      state.token = body.access_token;
      localStorage.setItem('sentinel_token', state.token);
      await loadCurrentUser();
      toast('Signed in successfully');
      setTimeout(() => go(loginDestination), 260);
    } catch (error) { showError(error); }
  };

  window.completeSignup = async function () {
    const password = document.getElementById('auth-password')?.value || '';
    const confirm = document.getElementById('signup-confirm')?.value || '';
    if (password !== confirm) { toast('Passwords do not match'); return; }
    try {
      const body = await request('/api/auth/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: document.getElementById('auth-email').value, password}),
      });
      state.token = body.access_token;
      localStorage.setItem('sentinel_token', state.token);
      await loadCurrentUser();
      toast('Account created successfully');
      setTimeout(() => go(loginDestination), 260);
    } catch (error) { showError(error); }
  };

  function configLive() {
    return head('config', 'Scan Configuration', 'Upload an OpenAPI document and scan the authorized sandbox API.', '') + `
      <div class="scan-config"><div class="card">
        <div class="section-title"><h3>API Project</h3><span class="pill good">Sandbox only</span></div>
        <div class="field"><label>Project name</label><input id="api-project-name" value="Sandbox Demo API"/></div>
        <div class="field"><label>Target API URL</label><input id="api-target-url" value="http://127.0.0.1:9000"/></div>
        <div class="field"><label>OpenAPI JSON or YAML file</label><input id="openapi-file" type="file" accept=".json,.yaml,.yml,application/json,application/yaml"/></div>
        <button class="btn primary" onclick="window.startBackendScan()">Start Scan →</button>
        <p class="muted" id="scan-config-message" style="margin-top:12px">Select an OpenAPI file to begin.</p>
      </div></div>`;
  }

  window.startBackendScan = async function () {
    const message = document.getElementById('scan-config-message');
    const file = document.getElementById('openapi-file')?.files?.[0];
    if (!file) { toast('Select an OpenAPI file first'); return; }
    try {
      if (message) message.textContent = 'Creating project and uploading specification...';
      const project = await request('/api/projects', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name: document.getElementById('api-project-name').value.trim() || 'Sandbox Demo API',
          description: 'Created by SentinelAPI workspace',
          base_url: document.getElementById('api-target-url').value.trim(),
        }),
      });
      state.project = project;
      const form = new FormData();
      form.append('project_id', project.id);
      form.append('file', file, file.name);
      state.scan = await request('/api/scans', {method: 'POST', body: form});
      state.scan = await request(`/api/scans/${state.scan.id}/start`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target_url: document.getElementById('api-target-url').value.trim()}),
      });
      toast('Scan started');
      go('live');
    } catch (error) { if (message) message.textContent = error.message; showError(error); }
  };

  function scanId() { return state.scan?.scan_id || state.scan?.id; }

  function liveBackend() {
    return head('live', 'Live Security Scan', 'Real-time progress from the SentinelAPI scan manager.', '') + `
      <div class="scan-live"><div class="card">
        <div class="section-title"><h3>Live Security Scan</h3><span class="pill good" id="backend-scan-state">connecting</span></div>
        <div class="ring"><div><strong id="backend-progress">0%</strong><small id="backend-progress-label">Waiting</small></div></div>
        <div class="progress"><span id="backend-progress-bar" style="width:0%"></span></div>
        <div id="backend-scan-message" class="live-list" style="margin-top:15px">Starting scan...</div>
      </div><div class="card"><div class="section-title"><h3>Scan Details</h3></div>
        <div id="backend-scan-details" class="log">Loading...</div>
      </div></div>`;
  }

  async function refreshScan() {
    if (!scanId()) return;
    try {
      const status = await request(`/api/scans/${scanId()}/status`);
      const progress = Number(status.progress || 0);
      const stateEl = document.getElementById('backend-scan-state');
      if (stateEl) stateEl.textContent = status.status;
      const progressEl = document.getElementById('backend-progress');
      if (progressEl) progressEl.textContent = `${progress}%`;
      const bar = document.getElementById('backend-progress-bar');
      if (bar) bar.style.width = `${progress}%`;
      const label = document.getElementById('backend-progress-label');
      if (label) label.textContent = `${status.tests_completed}/${status.tests_generated || 0} tests`;
      const message = document.getElementById('backend-scan-message');
      if (message) message.textContent = `${status.endpoints_discovered} endpoints discovered, ${status.findings} findings`;
      const details = document.getElementById('backend-scan-details');
      if (details) details.textContent = JSON.stringify(status, null, 2);
      if (status.status === 'completed' || status.status === 'failed' || status.status === 'cancelled') {
        clearInterval(state.poller); state.poller = null;
      }
    } catch (error) { showError(error); }
  }

  function startLiveUpdates() {
    clearInterval(state.poller);
    refreshScan();
    state.poller = setInterval(refreshScan, 800);
    if (scanId() && window.WebSocket) {
      try {
        state.socket?.close();
        const socketBase = API_BASE.replace(/^http/, 'ws');
        state.socket = new WebSocket(`${socketBase}/ws/scans/${scanId()}`);
        state.socket.onmessage = refreshScan;
        state.socket.onerror = () => state.socket.close();
      } catch (_) { /* polling remains authoritative */ }
    }
  }

  async function loadFindings() {
    if (!scanId()) return [];
    const result = await request(`/api/scans/${scanId()}/findings?page=1&limit=100`);
    state.findings = result.items || [];
    return state.findings;
  }

  window.selectBackendFinding = async function (id) {
    try { state.selectedFinding = await request(`/api/findings/${id}`); go('investigation'); }
    catch (error) { showError(error); }
  };

  views.config = configLive;
  views.live = liveBackend;
  views.findings = function () {
    const rows = state.findings.length ? state.findings.map(f => `<tr><td>${pill(esc(f.severity))}</td><td><b>${esc(f.title)}</b></td><td>${esc(f.endpoint?.path || '')}</td><td>${esc(f.status)}</td><td><button class="btn" onclick="selectBackendFinding('${f.id}')">View</button></td></tr>`).join('') : '<tr><td colspan="5">No findings loaded yet.</td></tr>';
    const page = head('findings', 'Findings', `${state.findings.length} findings from the selected scan`, '') + `<div class="card"><table class="table" id="backend-findings-table"><tr><th>Severity</th><th>Title</th><th>Endpoint</th><th>Status</th><th></th></tr>${rows}</table></div>`;
    loadFindings().then(() => {
      const table = document.getElementById('backend-findings-table');
      if (!table) return;
      table.innerHTML = `<tr><th>Severity</th><th>Title</th><th>Endpoint</th><th>Status</th><th></th></tr>${state.findings.map(f => `<tr><td>${pill(esc(f.severity))}</td><td><b>${esc(f.title)}</b></td><td>${esc(f.endpoint?.path || '')}</td><td>${esc(f.status)}</td><td><button class="btn" onclick="selectBackendFinding('${f.id}')">View</button></td></tr>`).join('') || '<tr><td colspan="5">No findings found.</td></tr>'}`;
    }).catch(showError);
    return page;
  };
  views.investigation = function () {
    const f = state.selectedFinding;
    if (!f) return head('investigation', 'Finding Investigation', 'Select a finding first.', '<button class="btn" onclick="go(\'findings\')">Back</button>');
    return head('investigation', 'Finding Investigation', esc(f.title), '<button class="btn" onclick="go(\'findings\')">← Back</button>') + `<div class="card">${pill(esc(f.severity))}<h2>${esc(f.title)}</h2><p>${esc(f.description)}</p><p><b>Confidence:</b> ${Math.round((f.confidence || 0) * 100)}%</p><p><b>Impact:</b> ${esc(f.impact)}</p><p><b>Remediation:</b> ${esc(f.remediation)}</p><h3>Evidence / PoC</h3><pre class="code">${esc(JSON.stringify(f.evidence || {poc_request:f.poc_request}, null, 2))}</pre></div>`;
  };
  views.profile = function () {
    const email = state.user?.email || 'Not signed in';
    const name = email.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
    const initials = name.split(' ').map(part => part[0]).join('').slice(0, 2).toUpperCase();
    return head('profile', 'Profile', 'Manage your SentinelAPI account and workspace identity', '') + `<div class="grid two"><div class="card"><div class="section-title"><h3>Account</h3><span class="pill fixed">Active</span></div><div style="display:flex;align-items:center;gap:16px;margin-bottom:18px"><div class="avatar" style="width:68px;height:68px;font-size:22px">${esc(initials)}</div><div><h2 style="margin:0 0 4px">${esc(name)}</h2><div class="muted">${esc(email)}</div></div></div><div class="grid two"><div class="field"><label>Email</label><input value="${esc(email)}" readonly/></div><div class="field"><label>User ID</label><input value="${esc(state.user?.id || '')}" readonly/></div></div></div></div>`;
  };
  views.report = function () {
    const page = head('report', 'Security Report', 'Generated from the selected backend scan.', '') + '<div class="card" id="backend-report"><p>Loading report...</p></div>';
    setTimeout(async () => {
      try {
        const report = await request(`/api/scans/${scanId()}/report`);
        const target = document.getElementById('backend-report');
        if (target) target.innerHTML = `<h2>${esc(report.title)}</h2><div class="report-score">${report.security_score}</div><p>${esc(report.executive_summary)}</p><pre class="code">${esc(JSON.stringify(report, null, 2))}</pre>`;
      } catch (error) { showError(error); }
    }, 0);
    return page;
  };

  const originalGo = window.go;
  window.go = function (key) {
    originalGo(key);
    updateWorkspaceIdentity();
    if (key === 'live') startLiveUpdates();
    if (key === 'findings') loadFindings().catch(showError);
  };
  applyWorkspaceTheme(localStorage.getItem('sentinelapi-mode') || 'dark');
  document.querySelectorAll('.modes button:not([data-mode])').forEach(button => { button.onclick = null; });
  loadCurrentUser();
})();
</script>
</body></html>
