<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="light dark"/>
<title>SentinelAPI — Security Workspace</title>
<link rel="stylesheet" href="styles.css"/>
<link rel="icon" href="data:,">
</head>
<body data-theme="dark">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <button class="brand brand-as-link" type="button" onclick="go('landing')" title="Back to landing page">
      <div class="logo">✓</div><span>SentinelAPI</span>
    </button>
    <nav class="nav" id="nav" aria-label="Workspace sections"></nav>
    <div class="spacer"></div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
  <main class="main">
    <header class="topbar">
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
      <div class="search">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search findings, scans, projects…" aria-label="Global search"/>
      </div>
      <div class="modes" role="group" aria-label="Theme">
        <button type="button" data-mode="light">☀ Light</button>
        <button type="button" data-mode="dark">◐ Dark</button>
        <button type="button" data-mode="system">Auto</button>
      </div>
      <button class="user user-btn" id="profile-btn" type="button" title="Open profile">
        <div class="avatar">?</div>
        <div class="user-identity"><b>Not signed in</b><small></small></div>
      </button>
    </header>
    <section class="content" id="content">
      <div class="page" id="page"></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
