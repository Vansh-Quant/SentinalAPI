services:
  backend:
    build: .
    container_name: sentinel-backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/sentinel
      SANDBOX_BASE_URL: http://sandbox:9000
      SCANNER_BASE_URL: http://scanner:9100
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-do-not-use-in-production-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_started

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: sentinel-sandbox
    ports:
      - "9000:9000"

  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # External scanner engine implementing the documented contract
  # (POST /scan/start, POST /scan/{scan_id}/cancel). Running the real engine
  # (scanner/service.py) instead of a no-op placeholder: an nginx placeholder
  # answered 404s, which the backend treats as a hard scanner error rather
  # than an outage, so out-of-box scans failed instead of using the
  # deterministic local fallback. Stop this service to reproduce outage
  # fallback behavior (connection refused -> local engine).
  scanner:
    build: .
    container_name: sentinel-scanner
    working_dir: /app
    command: ["uvicorn", "scanner.service:app", "--host", "0.0.0.0", "--port", "9100"]
    expose:
      - "9100"

volumes:
  sentinel_pgdata:
